# 1. Database Connection String
# Updated URL with allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Database Credentials
spring.datasource.username=root
spring.datasource.password=1234

# 3. Hibernate Properties
# 'update' means Spring will automatically create/update tables for you based on your Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Server Port
# Default is 8080. This is what your React Axios calls will target.
server.port=8080

# 5. Handle JSON properly
spring.jackson.serialization.indent_output=true